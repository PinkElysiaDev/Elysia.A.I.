$description:
  enabledIntentClassify: 启用意图识别（判断对方想做什么）。
  enabledEntityExtract: 启用实体抽取（从消息中提取关键信息）。
  enabledSentiment: 启用情感分析（判断对方情绪倾向）。
  aiEnhanced: 启用 AI 增强感知（需在 model-gateway 配置模型槽位）。
  maxInputTokens: 单次感知分析的最大输入 token 数。
  aiFallbackToRuleBased: AI 感知失败时回退到规则分析。
  aiMinTextLength: 触发 AI 增强的最短文本长度。
  aiModelSlot: AI 感知分析使用的模型槽位名（在 model-gateway 中配置），留空则使用默认槽位。

$name:
  基础设置: 基础设置
  AI 增强感知: AI 增强感知

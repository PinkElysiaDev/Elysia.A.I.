commands:
  elysia:
    description: Elysia A.I. 运行时管理

$description:
  manifestPath: 生命体清单 JSON 文件路径。留空则不加载预设生命体。
  stateRepository: 生命状态仓储类型：memory 为内存仓储（重启即丢），mongo 为 MongoDB 持久化。
  uri: MongoDB 连接 URI。当仓储类型为 mongo 时必填。
  database: MongoDB 数据库名。
  collection: MongoDB 集合名。
  stateType: 状态类型分区键。
  failFast: Mongo 初始化失败时是否中止 runtime 插件加载。

$name:
  基础设置: 基础设置
  MongoDB 持久化: MongoDB 持久化
